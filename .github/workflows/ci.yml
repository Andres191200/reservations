name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Environment validation (src/lib/env.ts) also runs during typegen and lint.
    env:
      DATABASE_URL: postgres://reservas:reservas@localhost:5432/reservas_test
      BETTER_AUTH_SECRET: ci-secret-do-not-use-in-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      # Cloudflare's Turnstile test keys: typegen runs as production, where they are mandatory.
      TURNSTILE_SITE_KEY: 1x00000000000000000000BB
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas -d reservas_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
